---
all:
  children:
    hardened:
      hosts:
        # Uncomment and set your box. Play 1 connects with the user you
        # currently have (cloud default, e.g. `ubuntu`), Play 2+ reconnects
        # as {{ admin_user }}.
        #
        # First run:
        #
        # my-server:
        #   ansible_host: 10.0.0.10
        #   ansible_user: ubuntu
        #
        # After the first run (or if you changed ssh_port), switch to the
        # admin user and add the port:
        #
        # my-server:
        #   ansible_host: 10.0.0.10
        #   ansible_user: admin
        #   ansible_ssh_private_key_file: keys/my-server/id_ed25519
        #   ansible_port: 22          # your ssh_port, if not the default
        #
        # With original_user_lockout: true in group_vars/all.yml the cloud
        # user (e.g. `ubuntu`) is disabled after Play 2; only `admin` works.
