[defaults]
inventory = inventory/hosts.yml
# A fresh server has a never-seen host key, so strict checking would fail the
# first run. This is a bootstrap tool; the trade-off is deliberate. If you
# prefer strict checking, set this to True (and pre-add host keys, or pass
# --ssh-common-args="-o StrictHostKeyChecking=accept-new" on first runs).
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
deprecation_warnings = False

[ssh_connection]
pipelining = True
