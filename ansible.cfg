[defaults]
inventory = inventory/hosts.yml
# Strict host key checking is ON: a clone of this repo behaves like any other
# Ansible setup. Your first run against a fresh box has an unknown host key,
# so pass the flag once:
#   ansible-playbook playbook.yml -i inventory/hosts.yml -K \
#     --ssh-common-args="-o StrictHostKeyChecking=accept-new"
# Set to False only if you understand the MITM trade-off.
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
deprecation_warnings = False

[ssh_connection]
pipelining = True
